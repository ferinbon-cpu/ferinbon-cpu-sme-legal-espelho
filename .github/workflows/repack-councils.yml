      - name: Publish repack run metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf 'stage\t05_CONSELHOS_REPACK\nrun_id\t%s\nsource_run_id\t37172287010\ncommit_sha\t%s\n' "${{ github.run_id }}" "${{ github.sha }}" > latest-councils-repack.tsv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-councils-repack.tsv
          git commit -m "ci: publish SME Legal Stage 05 repack metadata" || exit 0
