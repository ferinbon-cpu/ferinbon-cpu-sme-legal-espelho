name: SME Legal Stage 05 Councils Repack

on:
  push:
    paths:
      - 'requests/councils-repack-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Stage 05 source artifact
        uses: actions/download-artifact@v4
        with:
          name: sme-legal-stage05-conselhos
          path: input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37172287010

      - name: Split into Drive-safe chunks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, shutil
          from pathlib import Path
          src=Path('input/files')
          out=Path('chunks')
          out.mkdir(exist_ok=True)
          meta=list(csv.DictReader(open('input/metadata.tsv',encoding='utf-8'),delimiter='\t'))
          bypath={Path(r['relative_path']).as_posix().removeprefix('files/'):r for r in meta}
          for council in ['CACS_FUNDEB','CAE','FME']:
              files=sorted((src/council).rglob('*.pdf'), key=lambda p:(int(p.name.split('__',1)[0]) if p.name.split('__',1)[0].isdigit() else 999999999, p.as_posix()))
              for idx in range(0,len(files),20):
                  n=idx//20
                  d=out/f'{council}_{n:02d}'
                  (d/'files').mkdir(parents=True,exist_ok=True)
                  rows=[]
                  for p in files[idx:idx+20]:
                      rel=p.relative_to(src).as_posix()
                      dest=d/'files'/p.name
                      shutil.copy2(p,dest)
                      r=bypath.get(rel)
                      if r: rows.append(r)
                  if rows:
                      with open(d/'manifest.tsv','w',newline='',encoding='utf-8') as f:
                          w=csv.DictWriter(f,fieldnames=rows[0].keys(),delimiter='\t');w.writeheader();w.writerows(rows)
                  print(council,n,len(files[idx:idx+20]))
          PY

      - name: Upload CACS_FUNDEB chunk 00
        uses: actions/upload-artifact@v4
        with:
          name: stage05-CACS_FUNDEB-chunk-00
          path: chunks/CACS_FUNDEB_00/
          if-no-files-found: error
          compression-level: 6
          retention-days: 3

      - name: Upload CACS_FUNDEB chunk 01
        uses: actions/upload-artifact@v4
        with:
