name: SME Legal Unarchived Artifact Test

on:
  push:
    paths:
      - 'requests/unarchived-test.txt'

permissions:
  actions: read
  contents: read

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch existing batch artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11245303590/zip" \
            -o previous.zip
          mkdir previous
          unzip -q previous.zip -d previous
          test -f "previous/DOC-0004/DCN-Ensino-Fundamental-de-9-Anos-MEC.pdf"

      - name: Upload one raw unarchived artifact
        uses: actions/upload-artifact@v7
        with:
          path: previous/DOC-0004/DCN-Ensino-Fundamental-de-9-Anos-MEC.pdf
          archive: false
          retention-days: 1
