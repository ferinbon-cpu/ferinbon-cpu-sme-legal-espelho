name: SME Legal Raw Artifact Repack

on:
  push:
    paths:
      - 'requests/repack-current.txt'

permissions:
  actions: read
  contents: read

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch existing batch artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11247487242/zip"             -o previous.zip
          mkdir previous
          unzip -q previous.zip -d previous

      - name: Upload DOC-0117 raw
        uses: actions/upload-artifact@v7
        with:
          path: previous/DOC-0117/acolhimento_autista_mariana_-calsa.pdf
          archive: false
          retention-days: 1

      - name: Upload DOC-0118 raw
        uses: actions/upload-artifact@v7
        with:
          path: previous/DOC-0118/ame-tea_decreto.pdf
          archive: false
          retention-days: 1

