name: SME Legal Raw Artifact Repack

on:
  push:
    paths:
      - 'requests/repack-current.txt'

permissions:
  actions: read
  contents: read

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch existing batch artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11245303590/zip"             -o previous.zip
          mkdir previous
          unzip -q previous.zip -d previous

      - name: Upload DOC-0004 raw
        uses: actions/upload-artifact@v7
        with:
          path: previous/DOC-0004/DCN-Ensino-Fundamental-de-9-Anos-MEC.pdf
          archive: false
          retention-days: 1

      - name: Upload DOC-0068 raw
        uses: actions/upload-artifact@v7
        with:
          path: previous/DOC-0068/indicacao-conjunta-cme-sme-01-2021-versao-assinada-04-02-21.pdf
          archive: false
          retention-days: 1

      - name: Upload DOC-0069 raw
