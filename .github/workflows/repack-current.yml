name: SME Legal Raw Artifact Repack

on:
  push:
    paths:
      - 'requests/repack-current.txt'

permissions:
  actions: read
  contents: write

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch existing batch artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11248666961/zip" \
            -o previous.zip
          mkdir previous
          unzip -q previous.zip -d previous

      - name: Upload DOC-0142 raw
        uses: actions/upload-artifact@v7
        with:
          path: previous/DOC-0142/decreto_112_09_de_abril_2024.pdf
          archive: false
          retention-days: 1

      - name: Upload DOC-0143 raw
        uses: actions/upload-artifact@v7
        with:
          path: previous/DOC-0143/deliberacao-educacao-especial.pdf
          archive: false
          retention-days: 1

      - name: Upload DOC-0144 raw
        uses: actions/upload-artifact@v7
        with:
          path: previous/DOC-0144/htpc.pdf
          archive: false
          retention-days: 1

      - name: Upload DOC-0145 raw
        uses: actions/upload-artifact@v7
        with:
          path: previous/DOC-0145/is-3-transferencia-do-servidor-na-mesma-secretaria.pdf
          archive: false
          retention-days: 1

      - name: Upload DOC-0146 raw
        uses: actions/upload-artifact@v7
        with:
          path: previous/DOC-0146/lei-ordinaria-no-6976_2024-06-17t11_10_54-1.pdf
          archive: false
          retention-days: 1

      - name: Upload DOC-0147 raw
        uses: actions/upload-artifact@v7
        with:
          path: previous/DOC-0147/pc_decreto-nc2ba-14-professor-coordenador-1.pdf
          archive: false
          retention-days: 1

      - name: Upload DOC-0148 raw
        uses: actions/upload-artifact@v7
        with:
          path: previous/DOC-0148/pc_is-2-professor-coordenador-designacao-e-revogacao-.pdf
          archive: false
          retention-days: 1

      - name: Upload DOC-0149 raw
        uses: actions/upload-artifact@v7
        with:
          path: previous/DOC-0149/pc_modelo-1doc-para-designacao-revogacao.pdf
          archive: false
          retention-days: 1

      - name: Upload DOC-0150 raw
        uses: actions/upload-artifact@v7
        with:
          path: previous/DOC-0150/pc_resoluc3a7c3a3o-sme-02-pc-1.pdf
          archive: false
          retention-days: 1

      - name: Upload DOC-0151 raw
        uses: actions/upload-artifact@v7
        with:
          path: previous/DOC-0151/pc_termo-de-opcao-2-cargos.pdf
          archive: false
          retention-days: 1

      - name: Upload DOC-0152 raw
        uses: actions/upload-artifact@v7
        with:
          path: previous/DOC-0152/regimento_eleicao-coordenador.pdf
          archive: false
          retention-days: 1

      - name: Upload DOC-0153 raw
        uses: actions/upload-artifact@v7
        with:
          path: previous/DOC-0153/vc_is-1-vice-diretor-designacao-e-revogacao-2-1.pdf
          archive: false
          retention-days: 1

      - name: Upload DOC-0154 raw
        uses: actions/upload-artifact@v7
        with:
          path: previous/DOC-0154/vc_resolucao-vice-diretor.pdf
