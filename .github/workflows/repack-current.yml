      - name: Upload DOC-0166 raw
        uses: actions/upload-artifact@v7
        with:
          path: previous/DOC-0166/1.audiencia.publica.supervisao.nov_2024.pdf
          archive: false
          retention-days: 1

      - name: Publish repack run metadata
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'run_id\t%s\nrun_attempt\t%s\ncommit_sha\t%s\n' "$RUN_ID" "$RUN_ATTEMPT" "$COMMIT_SHA" > latest-repack.tsv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-repack.tsv
          git commit -m "ci: publish latest SME Legal repack run metadata" || exit 0
          git push
