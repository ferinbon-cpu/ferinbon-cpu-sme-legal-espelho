name: SME Legal Batch Download

on:
  push:
    paths:
      - 'requests/batch.tsv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original bytes and build manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/files
          printf 'doc_id\turl\tfilename\tsize_bytes\tsha256\tmime\n' > out/manifest.tsv
          while IFS=$'\t' read -r DOC_ID URL FILENAME; do
            [ -z "${DOC_ID:-}" ] && continue
            test -n "$URL"
            test -n "$FILENAME"
            echo "Downloading $DOC_ID -> $FILENAME"
            curl --location --fail --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 600 \
              --output "out/files/$FILENAME" "$URL"
            SIZE=$(stat -c %s "out/files/$FILENAME")
            SHA256=$(sha256sum "out/files/$FILENAME" | awk '{print $1}')
            MIME=$(file --brief --mime-type "out/files/$FILENAME")
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$DOC_ID" "$URL" "$FILENAME" "$SIZE" "$SHA256" "$MIME" >> out/manifest.tsv
          done < requests/batch.tsv
          cat out/manifest.tsv

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sme-legal-batch
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
