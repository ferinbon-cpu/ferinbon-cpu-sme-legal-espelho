name: SME Legal Canonical Batch Download

on:
  push:
    paths:
      - 'requests/next.tsv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original bytes
        shell: bash
        run: |
          set -uo pipefail
          test -f requests/next.tsv
          mkdir -p out
          : > out/metadata.tsv
          : > out/errors.tsv
          while IFS=$'\t' read -r DOC_ID URL FILENAME; do
            [ -z "${DOC_ID:-}" ] && continue
            [ "$DOC_ID" = "doc_id" ] && continue
            [[ "$DOC_ID" =~ ^# ]] && continue
            if [ -z "$URL" ] || [ -z "$FILENAME" ]; then
              printf '%s\t%s\t%s\tINVALID_REQUEST\n' "$DOC_ID" "$URL" "$FILENAME" >> out/errors.tsv
              continue
            fi
            mkdir -p "out/$DOC_ID"
            TARGET="out/$DOC_ID/$FILENAME"
            echo "Downloading $DOC_ID -> $FILENAME"
            if curl --location --fail --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 600 --output "$TARGET" "$URL"; then
              SIZE=$(stat -c %s "$TARGET")
              SHA256=$(sha256sum "$TARGET" | awk '{print $1}')
              MIME=$(file --brief --mime-type "$TARGET")
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$DOC_ID" "$URL" "$FILENAME" "$SIZE" "$SHA256" "$MIME" >> out/metadata.tsv
            else
              rm -f "$TARGET"
              printf '%s\t%s\t%s\tDOWNLOAD_FAILED\n' "$DOC_ID" "$URL" "$FILENAME" >> out/errors.tsv
            fi
          done < requests/next.tsv
          echo "--- metadata.tsv ---"
          cat out/metadata.tsv
          echo "--- errors.tsv ---"
          cat out/errors.tsv

      - name: Upload temporary artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: sme-legal-batch
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Publish run metadata
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'run_id\t%s\nrun_attempt\t%s\nartifact_id\t%s\ncommit_sha\t%s\n' \
            "$RUN_ID" "$RUN_ATTEMPT" "${ARTIFACT_ID:-}" "$COMMIT_SHA" > latest-run.tsv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-run.tsv
          git commit -m "ci: publish latest SME Legal batch run metadata" || exit 0
          git push
